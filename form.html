<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>File Handling</title>
</head>
<body>
  <h2>Keyword Redaction</h2>
  <form action="proses.php" method="post" enctype="multipart/form-data">
    <label>Keyword:</label><br>
    <input type="text" name="keyword" required><br><br>

    <label>Upload File:</label><br>
    <span>(file dengan format html & txt saja yang diterima)</span><br>
    <input type="file" name="file" accept=".txt,.html" required><br><br>

    <label>Opsi:</label><br>
    <select name="operation">
      <option value="find">Find</option>
      <option value="redact">Redact</option>
    </select><br><br>

    <label>Hasil Akhir:</label><br>
    <select name="output_type">
      <option value="N">Simpan jadi File Baru</option>
      <option value="O">Edit File Asli</option>
    </select><br><br>

    <button type="submit">submit</button>
  </form>
</body>
</html>
